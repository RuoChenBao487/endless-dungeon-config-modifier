[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "endless-dungeon-config-modifier"
version = "0.2.0"
description = "A configuration DSL, launcher and session-only modifier for Endless Dungeon 16.0."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pygame>=2.6.1,<2.7"]

[project.scripts]
dungeon-dsl = "dungeon_dsl.cli:main"
dungeon-modifier = "modifier.gui:main"

[tool.setuptools.packages.find]
include = ["dungeon_dsl*", "modifier*"]
